# kharb.edge — full-site Cloudflare Worker in front of Render Free backend.
# Worker-only setup (no Pages): this Worker serves pages (edge-cached) AND
# proxies /api/* to Render. Free plan, no card: 100k req/day.
# Deploy: npx wrangler deploy
name = "kharb-edge"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Production origin (Render Free Docker, Singapore). Override per deploy:
#   npx wrangler deploy --var RENDER_ORIGIN:https://xxxx.onrender.com
[vars]
RENDER_ORIGIN = "https://itachi-cawx.onrender.com"

# Secrets (never commit): npx wrangler secret put ORIGIN_TOKEN
# Must match the backend ORIGIN_TOKEN env on Render (see middleware.ts).

# Note: with no [[routes]] active, wrangler enables the workers.dev test URL
# by default (wanted for now). After cutover is verified, add
# workers_dev = false + preview_urls = false for custom-domains-only.

# Custom-domain routes (Worker-only setup — Pages NOT used).
# ACTIVATED after kharb.online is added to Cloudflare: uncomment, deploy.
# Until then they stay commented — wrangler aborts the whole deploy if a
# zone doesn't exist yet (code 10083).
# [[routes]]
# pattern = "kharb.online/*"
# zone_name = "kharb.online"

# [[routes]]
# pattern = "www.kharb.online/*"
# zone_name = "kharb.online"
